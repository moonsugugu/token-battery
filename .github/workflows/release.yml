name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag (e.g. v1.3.5)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify stable tag matches app version
        run: node tools/verify-release.cjs
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: npm run dist -- --publish never
      - name: Build universal macOS DMG and ZIP
        if: matrix.platform == 'macos'
        run: npm run dist:mac -- --publish never
      - name: Verify Windows release artifacts
        if: matrix.platform == 'windows'
        run: node tools/verify-release.cjs --artifacts
      - name: Verify macOS release artifacts
        if: matrix.platform == 'macos'
        run: node tools/verify-release.cjs --mac-artifacts
      - name: Upload Windows packages
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: TokenBattery-${{ env.RELEASE_TAG }}-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload macOS packages
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: TokenBattery-${{ env.RELEASE_TAG }}-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TokenBattery-${{ env.RELEASE_TAG }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete release
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Windows
          Download and run the Windows `.exe` installer below.

          ## macOS
          Download the universal DMG for Intel and Apple Silicon, open it, and drag TokenBattery to Applications. This build is not signed or notarized; on first launch, Control-click TokenBattery and choose Open.

          Windows installs can update from inside the app. macOS updates are installed by downloading the new DMG and replacing the app in Applications. Your local settings and companion progress are kept.
          EOF
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "TokenBattery $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

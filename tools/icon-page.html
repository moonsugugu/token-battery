<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="../renderer/characters.js"></script>
<script>
// 앱 아이콘: 둥근 사각형 위 여우 파일럿 + 오른쪽 아래 로봇 / 트레이: 여우 얼굴만(작은 크기용)
function appIconSVG() {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ec1ff"/><stop offset="1" stop-color="#4f56e8"/></linearGradient>
      <radialGradient id="shine" cx=".3" cy=".2" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>
    <g fill="#fff" opacity=".9"><path d="M40 52 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/><path d="M214 40 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/></g>
    <svg x="18" y="20" width="176" height="184" viewBox="14 2 92 96">${fox('fresh')}</svg>
    <svg x="138" y="132" width="108" height="98" viewBox="10 0 100 90">${robot('fresh')}</svg>
  </svg>`;
}
function trayIconSVG() {
  // 작은 크기에서는 꼬리 끝이 얼룩처럼 보여서 뺀다
  const head = fox('fresh').replace(/<path d="M86 108[^>]*\/>/, '').replace(/<path d="M104 74[^>]*\/>/, '');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 4 88 92">${head}</svg>`;
}
function render(svg, w, h) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function makeAll() {
  const app = appIconSVG();
  const tray = trayIconSVG();
  return {
    'icon.png': await render(app, 256, 256),
    'icon-512.png': await render(app, 512, 512),
    'tray.png': await render(tray, 32, 33),
    'tray@2x.png': await render(tray, 64, 67),
  };
}
</script>
</body></html>

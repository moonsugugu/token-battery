<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=VT323&family=Press+Start+2P&family=Jua&family=Do+Hyeon&family=Gowun+Dodum&family=Noto+Serif+KR:wght@500;800&display=swap">
<title>TokenBattery</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="upgrade.css">
</head>
<body class="mode-mini theme-cyber">

<dialog class="hotkey-setup" id="hotkeySetupDialog" aria-labelledby="hotkeySetupTitle" aria-describedby="hotkeySetupIntro">
  <div class="tutorial-progress"><span data-i18n="tutorialTitle"></span><b id="tutorialProgress"></b></div>
  <section data-tutorial-step="0">
  <h2 id="hotkeySetupTitle" data-i18n="hkSetupTitle"></h2>
  <p id="hotkeySetupIntro" data-i18n="hkSetupIntro"></p>
  <div class="setup-key-row"><span data-i18n="hkFull"></span><button type="button" class="chip hk" data-hk="full" data-i18n-aria-label="hkFull"></button></div>
  <div class="setup-key-row"><span data-i18n="hkCycleShort"></span><button type="button" class="chip hk" data-hk="toggle" data-i18n-aria-label="hkCycleShort"></button></div>
  <p class="note" data-i18n="hkSetupCycle"></p>
  <p class="note" data-i18n="hkHint"></p>
  <p class="note hk-message" id="hkSetupMsg" role="status" aria-live="polite"></p>
  <p class="note" data-i18n="hkSetupLater"></p>
  <button type="button" class="chip ghost" id="btnHotkeyDefaults" data-i18n="hkDefaults"></button>
  </section>
  <section class="hidden" data-tutorial-step="1">
    <h2 id="tutorialModesTitle" data-i18n="tutorialModesTitle"></h2>
    <p data-i18n="tutorialModesIntro"></p>
    <div class="tutorial-mode"><b data-i18n="taskbarMode"></b><span data-i18n="tutorialTaskbar"></span></div>
    <div class="tutorial-mode"><b data-i18n="mini"></b><span data-i18n="tutorialMini"></span></div>
    <div class="tutorial-mode"><b data-i18n="charMode"></b><span data-i18n="tutorialCharacter"></span></div>
    <div class="tutorial-mode"><b data-i18n="expand"></b><span data-i18n="tutorialFull"></span></div>
    <p class="note" data-i18n="tutorialTray"></p>
  </section>
  <section class="hidden" data-tutorial-step="2">
    <h2 id="tutorialConnectTitle" data-i18n="tutorialConnectTitle"></h2>
    <div class="tutorial-mode"><b>Codex</b><span data-i18n="tutorialCodex"></span></div>
    <div class="tutorial-mode"><b>Claude</b><span data-i18n="tutorialClaude"></span></div>
    <div class="tutorial-mode"><b data-i18n="settings"></b><span data-i18n="tutorialSettings"></span></div>
    <p class="note" data-i18n="tutorialPreserve"></p>
  </section>
  <div class="setup-actions"><button type="button" class="chip ghost" id="btnTutorialSkip" data-i18n="tutorialSkip"></button><button type="button" class="chip ghost hidden" id="btnTutorialBack" data-i18n="tutorialBack"></button><button type="button" class="chip" id="btnTutorialNext" data-i18n="tutorialNext"></button><button type="button" class="chip hidden" id="btnHotkeySetupDone" data-i18n="hkSetupDone"></button></div>
</dialog>

<!-- ===== 작업표시줄: 활성 서비스마다 한 줄 ===== -->
<div class="card taskbar" id="taskbarCard" tabindex="0" role="button" data-i18n-title="taskbarHelp" data-i18n-aria-label="taskbarHelp">
  <div id="taskbarRows"></div>
</div>

<!-- ===== 미니 모드 (기본) ===== -->
<div class="card mini" id="miniCard">
  <div class="mini-rows" id="miniRows"></div>
  <div class="ctrl ctrl-grid">
    <button class="icon" data-go="settings" data-i18n-title="settings">⚙</button>
    <button class="icon" data-go="full" data-i18n-title="expand">⤢</button>
    <button class="icon" data-go="char" data-i18n-title="charMode">☺</button>
    <button class="icon" data-go="taskbar" data-i18n-title="taskbarMode">▤</button>
    <button class="icon" data-go="hide" data-i18n-title="hide">✕</button>
  </div>
  <div class="grip gl" data-grip="left" data-i18n-title="resize"></div><div class="grip gr" data-grip="right" data-i18n-title="resize"></div>
</div>

<!-- ===== 캐릭터 모드 ===== -->
<div class="card char" id="charCard">
  <div class="ctrl ctrl-row">
    <button class="icon" data-go="settings" data-i18n-title="settings">⚙</button>
    <button class="icon" data-go="full" data-i18n-title="expand">⤢</button>
    <button class="icon" data-go="mini" data-i18n-title="mini">▭</button>
    <button class="icon" data-go="taskbar" data-i18n-title="taskbarMode">▤</button>
    <button class="icon" data-go="hide" data-i18n-title="hide">✕</button>
  </div>
  <div class="scene" id="scene"></div>
  <div class="grip gl" data-grip="left" data-i18n-title="resize"></div><div class="grip gr" data-grip="right" data-i18n-title="resize"></div>
</div>

<!-- ===== 전체 모드 (TokenBattery) ===== -->
<div class="card full" id="card">
  <header class="titlebar">
    <span class="logo" id="themeLogo"></span>
    <span class="battery-mark" aria-hidden="true"><i></i></span>
    <div class="tt"><span class="title" data-i18n="appName">TokenBattery</span><span class="tsub" id="themeSub"></span></div>
    <span class="vsep"></span>
    <span class="sync"><span data-i18n="sync"></span> <b id="syncTime">--:--</b><i class="dot"></i></span>
    <span class="spacer"></span>
    <button class="hbtn" id="btnMusic" data-i18n-title="bgmPlay">♫</button>
    <button class="hbtn" id="btnSettings" data-i18n-title="settings">⚙</button>
    <div class="ctrl ctrl-row hdr">
      <button class="icon" id="btnRefresh" data-i18n-title="refresh">⟳</button>
      <button class="icon" data-go="char" data-i18n-title="charMode">☺</button>
      <button class="icon" data-go="mini" data-i18n-title="mini">▭</button>
      <button class="icon" data-go="taskbar" data-i18n-title="taskbarMode">▤</button>
      <button class="icon" data-go="hide" data-i18n-title="hide">✕</button>
    </div>
    <div class="brandrow" aria-label="문수네집 공식 링크">
      <span class="made-by">made by</span>
      <a class="brand-btn" href="https://moonsunezip.com" target="_blank" rel="noreferrer">🏠 문수네집</a>
      <a class="brand-btn" href="https://www.instagram.com/moonsune.zip/" target="_blank" rel="noreferrer">📸 Instagram</a>
      <a class="brand-btn" href="https://moonsunezip.com" target="_blank" rel="noreferrer">✨ moonsune.zip</a>
    </div>
  </header>

  <!-- 설정 -->
  <section class="update-banner hidden" id="updateBanner" aria-live="polite">
    <span id="updateBannerText"></span><button class="chip" id="btnUpdateBanner" data-i18n="updateView"></button>
  </section>
  <section class="panel settings hidden" id="settings">
    <div class="row"><b data-i18n="tutorialTitle"></b><button type="button" class="chip" id="btnTutorialReplay" data-i18n="tutorialReplay"></button></div>
    <section class="update-panel" id="updatePanel">
      <div class="row"><b data-i18n="updateTitle"></b><span class="smeta" id="appVersion"></span></div>
      <p class="note" id="updateStatus" role="status" aria-live="polite"></p>
      <progress id="updateProgress" max="100" value="0" class="hidden" data-i18n-aria-label="updateDownloading"></progress>
      <div class="row wrap">
        <button class="chip" id="btnCheckUpdate" data-i18n="updateCheck"></button>
        <button class="chip hidden" id="btnDownloadUpdate" data-i18n="updateDownload"></button>
        <button class="chip hidden" id="btnInstallUpdate" data-i18n="updateInstall"></button>
        <button class="chip ghost" id="btnUpdateReleases" data-i18n="updateReleases"></button>
      </div>
      <p class="note" data-i18n="updateHelp"></p>
    </section>
    <label class="row"><span data-i18n="lang"></span> <select id="langSel"></select></label>
    <section class="theme-preview" aria-labelledby="themePreviewTitle">
      <b id="themePreviewTitle" data-i18n="themePreviewTitle"></b>
      <div class="theme-preview-pair" id="themePreview"></div>
    </section>
    <label class="row"><span data-i18n="theme"></span> <select id="themeSel"></select></label>
    <label class="row"><span data-i18n="displayMode"></span> <select id="modeSel"></select></label>
    <div class="row"><span data-i18n="show"></span>
      <label><input type="checkbox" id="showClaude"> Claude</label>
      <label><input type="checkbox" id="showCodex"> Codex</label>
    </div>
    <details class="fold bond-settings" id="bondFold">
      <summary data-i18n="bondCollection"></summary>
      <p class="note" data-i18n="bondHelp"></p>
      <label class="row"><span data-i18n="bondPreviewState"></span> <select id="bondPreview"></select></label>
      <div id="bondCollection"></div>
      <p class="note" data-i18n="bondCalibration"></p>
    </details>
    <div class="row"><span data-i18n="basisLbl"></span>
      <label><input type="radio" name="basis" value="remain" id="basisRemain"> <span data-i18n="basisRemain"></span></label>
      <label><input type="radio" name="basis" value="used" id="basisUsed"> <span data-i18n="basisUsed"></span></label>
    </div>
    <div class="row"><span data-i18n="timeBasisLbl"></span>
      <label><input type="radio" name="timeBasis" value="clock" id="timeBasisClock"> <span data-i18n="timeBasisClock"></span></label>
      <label><input type="radio" name="timeBasis" value="remaining" id="timeBasisRemaining"> <span data-i18n="timeBasisRemaining"></span></label>
    </div>
    <div class="row wrap"><span data-i18n="features"></span>
      <label><input type="checkbox" id="optAlerts"> <span data-i18n="alerts"></span></label>
      <label><input type="checkbox" id="optCost"> <span data-i18n="cost"></span></label>
    </div>
    <div class="row indent" id="alertLevelsRow">
      <label><input type="checkbox" class="lvl" value="70"> 70%</label>
      <label><input type="checkbox" class="lvl" value="85"> 85%</label>
      <label><input type="checkbox" class="lvl" value="95"> 95%</label>
    </div>
    <div class="row"><span data-i18n="hotkeys"></span> <span class="smeta" data-i18n="hkHint"></span></div>
    <div class="row indent"><span class="lbl" data-i18n="hkFull"></span><button class="chip hk" data-hk="full" data-i18n-aria-label="hkFull"></button></div>
    <div class="row indent"><span class="lbl" data-i18n="hkToggle"></span><button class="chip hk" data-hk="toggle" data-i18n-aria-label="hkToggle"></button></div>
    <div class="note" id="hkMsg"></div>
    <label class="row"><span data-i18n="opacity"></span> <input type="range" id="opacity" min="0.4" max="1" step="0.02"></label>
    <label class="row"><input type="checkbox" id="autostart"> <span data-i18n="autostart"></span></label>
    <div class="row">
      <button class="chip" id="btnClaudeLogin2" data-i18n="claudeLogin"></button>
      <button class="chip" id="btnManual2" data-i18n="claudeManual"></button>
    </div>
    <section class="notifyconfig">
      <div class="row notify-head"><b data-i18n="notifyTitle"></b><div class="row notify-head-actions"><button type="button" class="chip ghost" id="btnNotifyHelp" data-i18n="notifyHelpOpen" aria-haspopup="dialog" aria-controls="notifyHelpDialog"></button><label><input type="checkbox" id="notifyEnabled"> <span data-i18n="notifyOn"></span></label></div></div>
      <div class="row">
        <label><span data-i18n="notifyProvider"></span>
          <select id="notifyProvider"><option value="telegram" data-i18n="notifyTelegram"></option><option value="kakao" data-i18n="notifyKakao"></option></select>
        </label>
        <label><span data-i18n="notifyMin"></span> <input id="notifyMinMinutes" type="number" min="1" max="1440" step="1" value="10"></label>
      </div>
      <label class="row notify-check"><input type="checkbox" id="notifySkipForeground"> <span data-i18n="notifySkipForeground"></span></label>
      <div class="notify-provider" id="telegramPane">
        <label class="notify-field"><span data-i18n="notifyBotToken"></span><input id="telegramBotToken" type="password" autocomplete="off" spellcheck="false"></label>
        <label class="notify-field"><span data-i18n="notifyChatId"></span><input id="telegramChatId" type="text" autocomplete="off" spellcheck="false"></label>
        <div class="row notify-actions"><button class="chip ghost" id="btnTelegramSave" data-i18n="notifySave"></button><button class="chip ghost" id="btnTelegramFindChat" data-i18n="notifyFindChat"></button></div>
        <div class="note" data-i18n="notifyTelegramHelp"></div>
      </div>
      <div class="notify-provider hidden" id="kakaoPane">
        <label class="notify-field"><span data-i18n="notifyKakaoKey"></span><input id="kakaoRestKey" type="password" autocomplete="off" spellcheck="false"></label>
        <label class="notify-field"><span data-i18n="notifyKakaoSecret"></span><input id="kakaoClientSecret" type="password" autocomplete="off" spellcheck="false"></label>
        <div class="row notify-actions"><button class="chip ghost" id="btnKakaoConnect" data-i18n="notifyKakaoConnect"></button><button class="chip ghost" id="btnKakaoDisconnect" data-i18n="notifyKakaoDisconnect"></button></div>
        <div class="note"><span data-i18n="notifyKakaoHelp"></span><br><code id="kakaoRedirectUri"></code></div>
      </div>
      <div class="row notify-actions"><button class="chip" id="btnNotificationTest" data-i18n="notifyTest"></button><span class="smeta" id="notifyConnectionState"></span></div>
      <div class="notify-hookbox">
        <div class="row"><b data-i18n="notifyHooksTitle"></b><span class="smeta" id="notifyHooksState"></span></div>
        <div class="notify-hook-status" id="notifyHookSetupStatus" role="status" aria-live="polite"></div>
        <div class="row notify-actions"><button class="chip ghost" id="btnInstallNotifyHooks" data-i18n="notifyHooksInstall"></button><button class="chip ghost" id="btnRemoveNotifyHooks" data-i18n="notifyHooksRemove"></button></div>
        <div class="note" data-i18n="notifyHooksHelp"></div>
      </div>
      <div class="note notify-result" id="notifyResult" aria-live="polite"></div>
    </section>
  </section>

  <dialog class="notify-help-dialog" id="notifyHelpDialog" aria-labelledby="notifyHelpDialogTitle">
    <div class="notify-help-head">
      <div><div class="notify-help-eyebrow" data-i18n="notifyHelpEyebrow"></div><h2 id="notifyHelpDialogTitle" data-i18n="notifyHelpDialogTitle"></h2></div>
      <button type="button" class="icon notify-help-close" id="btnNotifyHelpClose" data-i18n-title="notifyHelpClose" data-i18n-aria-label="notifyHelpClose">×</button>
    </div>
    <div class="notify-help-body">
      <p class="notify-help-intro" data-i18n="notifyHelpIntro"></p>
      <section class="notify-help-section recommended">
        <h3 data-i18n="notifyHelpTelegramTitle"></h3>
        <ol id="notifyHelpTelegramSteps"></ol>
        <div class="notify-help-note" data-i18n="notifyHelpTelegramNote"></div>
      </section>
      <section class="notify-help-section">
        <h3 data-i18n="notifyHelpKakaoTitle"></h3>
        <ol id="notifyHelpKakaoSteps"></ol>
        <div class="notify-help-redirect">
          <b data-i18n="notifyHelpRedirectLabel"></b>
          <code id="notifyHelpRedirectUri"></code>
          <p data-i18n="notifyHelpRedirectHint"></p>
        </div>
        <div class="notify-help-note" data-i18n="notifyHelpKakaoNote"></div>
      </section>
      <section class="notify-help-section">
        <h3 data-i18n="notifyHelpAgentsTitle"></h3>
        <ol id="notifyHelpAgentSteps"></ol>
      </section>
      <section class="notify-help-section notify-help-troubleshoot">
        <h3 data-i18n="notifyHelpTroubleTitle"></h3>
        <p data-i18n="notifyHelpTroubleBody"></p>
        <b data-i18n="notifyHelpPrivacyTitle"></b>
        <p data-i18n="notifyHelpPrivacyBody"></p>
      </section>
      <section class="notify-help-links">
        <b data-i18n="notifyHelpLinksTitle"></b>
        <div class="row">
          <button type="button" class="chip ghost" data-guide-url="https://t.me/BotFather">BotFather</button>
          <button type="button" class="chip ghost" data-guide-url="https://developers.kakao.com/docs/ko/kakaologin/prerequisite">Kakao Login</button>
          <button type="button" class="chip ghost" data-guide-url="https://developers.kakao.com/docs/ko/kakaotalk-message/rest-api">KakaoTalk Message</button>
          <button type="button" class="chip ghost" data-guide-url="https://code.claude.com/docs/en/hooks">Claude Code</button>
          <button type="button" class="chip ghost" data-guide-url="https://developers.openai.com/codex/hooks">Codex Hooks</button>
        </div>
      </section>
    </div>
    <div class="notify-help-footer"><button type="button" class="chip" id="btnNotifyHelpDone" data-i18n="notifyHelpClose"></button></div>
  </dialog>

  <!-- 오늘의 상태 -->
  <div class="sechead">
    <h2 data-i18n="today"></h2>
    <span class="rule"></span>
    <span class="daymsg" id="dayMsg"></span>
  </div>
  <div class="bond-notice hidden" id="bondNotice" role="status" aria-live="polite"></div>
  <div class="crew" id="crew"></div>
  <div class="note crew-note" id="claudeNote"></div>
  <div class="note crew-note" id="codexNote"></div>
  <form class="panel manual hidden" id="manualForm">
    <div class="mgrid">
      <label><span data-i18n="m5"></span><input type="number" min="0" max="100" id="m5"></label>
      <label><span data-i18n="m5r"></span><input type="datetime-local" id="m5r"></label>
      <label><span data-i18n="mw"></span><input type="number" min="0" max="100" id="mw"></label>
      <label><span data-i18n="mwr"></span><input type="datetime-local" id="mwr"></label>
    </div>
    <div class="row end">
      <button type="button" class="chip ghost" id="btnOpenClaudeUsage" data-i18n="openUsage"></button>
      <button type="submit" class="chip" data-i18n="save"></button>
    </div>
  </form>

  <!-- 다음 회복 -->
  <div class="rowcard recover">
    <div class="rhead"><span class="rico">⏱</span><b data-i18n="nextRecover"></b><span class="rule"></span></div>
    <div class="rbody" id="recover"></div>
  </div>

  <!-- 구독 관리 (+ 비용 분석) -->
  <details class="rowcard fold subsfold" id="subsFold">
    <summary>
      <span class="crown">♛</span>
      <span class="stext"><b data-i18n="subsTitle"></b><small id="subsSub"></small></span>
      <span class="chev">›</span>
    </summary>
    <div class="subs-inner">
      <div class="subtotal" id="subsTotal"></div>
      <ul class="subs" id="subsList"></ul>
      <div id="subsEditor" class="hidden">
        <div class="subs-edit" id="subsEditList"></div>
        <div class="row end">
          <button class="chip ghost" id="btnAddSub" data-i18n="addSub"></button>
          <button class="chip" id="btnSaveSubs" data-i18n="done"></button>
        </div>
      </div>
      <div class="row end" id="subsActions">
        <button class="chip ghost" id="btnEditSubs" data-i18n="editAdd"></button>
      </div>
      <div class="costwrap" id="costFold">
        <div class="costhead"><b data-i18n="costTitle"></b><span class="src" id="costSummary"></span></div>
        <div id="costBody"></div>
      </div>
    </div>
    <datalist id="aiServices"></datalist>
  </details>

  <!-- BGM + 새 작업 -->
  <div class="rowcard bgmbar">
    <div class="thumb" id="bgmThumb"><i class="moon"></i><i class="stars"></i><i class="sky"></i></div>
    <div class="bgmmid">
      <div class="bgmtitle">BGM · <select id="bgmMood"></select></div>
      <div class="bgmctl">
        <button class="playbtn" id="btnBgm" data-i18n-title="bgmPlay">▶</button>
        <span class="wave" id="wave"></span>
        <button class="icon srch" id="btnBgmSearch" data-i18n-title="search">⌕</button>
      </div>
    </div>
    <button class="cta" id="btnNewTask"><span class="plus">＋</span><span data-i18n="newTask"></span></button>
    <div class="ctamenu hidden" id="ctaMenu">
      <button data-open="https://claude.ai/new">Claude</button>
      <button data-open="https://chatgpt.com/codex">Codex</button>
    </div>
  </div>
  <div class="row bgmsearch hidden" id="bgmSearchRow">
    <input type="text" id="bgmCustom" data-i18n-ph="ph_bgm">
    <button class="chip ghost" id="btnBgmCustom" data-i18n="search"></button>
  </div>
  <div class="foot" id="themeFoot"></div>
  <div class="grip gl" data-grip="left" data-i18n-title="resize"></div><div class="grip gr" data-grip="right" data-i18n-title="resize"></div>
</div>
<script src="i18n.js"></script>
<script src="hotkeys.js"></script>
<script src="companions.js"></script>
<script src="characters.js"></script>
<script src="app.js"></script>
<script src="updates-ui.js"></script>
</body>
</html>
